<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <title>Boxplot PM2.5 & PM10</title>
        <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/echarts/dist/extension/dataTool.min.js"></script>
        <style>
                body {
                        font-family: 'Open Sans', sans-serif;
                }

                /* ปรับความกว้างและความสูงของกราฟ และจัดให้อยู่ตรงกลาง */
                #trend {
                        width: 100%;
                        height: 500px;
                        margin: auto;
                        border: 1px solid #ccc;
                        padding: 10px;
                }

                .controls {
                        margin: 10px 0;
                        text-align: center;
                        /* จัดปุ่มให้อยู่ตรงกลาง */
                }

                button {
                        font-size: 1rem;
                        /* ปรับขนาดตัวอักษรให้ใหญ่ขึ้น */
                        padding: 7px 25px;
                        /* เพิ่ม padding เพื่อให้ปุ่มดูใหญ่ขึ้น */
                        margin-right: 15px;
                        /* เพิ่มระยะห่างระหว่างปุ่ม */
                        border-radius: 12px;
                        /* ทำให้ขอบมนขึ้น */
                        border: 1px solid #ccc;
                        /* เพิ่มเส้นขอบเล็กน้อย */
                        background-color: #eee;
                        /* เปลี่ยนสีพื้นหลังให้เป็นสีเทาอ่อน */
                        cursor: pointer;
                        /* แสดงสัญลักษณ์มือเมื่อเอาเมาส์ไปชี้ */
                        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
                        /* เพิ่ม transition */
                }

                button:hover {
                        background-color: #ddd;
                        /* เปลี่ยนสีเมื่อเอาเมาส์ไปชี้ */
                }

                /* ********** CSS ใหม่สำหรับปุ่มที่ถูกเลือก ********** */
                button.active {
                        background-color: #007BFF;
                        /* สีฟ้า */
                        color: #FFFFFF;
                        border-color: #007BFF;
                }

                button.active:hover {
                        background-color: #0056b3;
                        /* สีเข้มขึ้นเมื่อ hover */
                }

                /* ********** /CSS ใหม่สำหรับปุ่มที่ถูกเลือก ********** */


                #error-box {
                        color: #fff;
                        background: #030202;
                        padding: 30px;
                        margin: 20px 0;
                        font-size: 2rem;
                        font-weight: bold;
                        border-radius: 12px;
                        text-align: center;
                        display: none;
                }

                /* โค้ด CSS สำหรับ Navbar ที่อยู่ด้านบน */
                .navbar {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        padding: 0.75rem 2rem;
                        background-color: #FFFFFF;
                        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                        position: fixed;
                        width: 100%;
                        top: 0;
                        left: 0;
                        z-index: 6000;
                }

                .navbar-brand {
                        font-size: 1.5rem;
                        font-weight: bold;
                        color: #333333;
                }

                .navbar-links {
                        list-style: none;
                        display: flex;
                        margin: 0;
                        padding: 0;
                }

                .navbar-links li {
                        margin-right: 2rem;
                }

                .navbar-links a {
                        text-decoration: none;
                        color: #555555;
                        font-size: 1.1rem;
                        transition: color 0.3s ease;
                }

                .navbar-links a:hover {
                        color: #68696b;
                }

                .contact-button {
                        background-color: #007BFF;
                        color: #FFFFFF;
                        padding: 0.75rem 1.5rem;
                        border-radius: 25px;
                        text-decoration: none;
                        font-weight: bold;
                        transition: background-color 0.3s ease;
                }

                .contact-button:hover {
                        background-color: #6e7071;
                }

                /* ปรับเนื้อหาหลักให้เลื่อนลงมาเพื่อไม่ให้ทับ Navbar */
                body {
                        padding-top: 4.5rem;
                        /* กำหนด padding-top เพื่อเว้นช่องว่างสำหรับ Navbar */
                }

                .container {
                        text-align: center;
                }
        </style>
</head>

<body>
        <nav class="navbar">
                <ul class="navbar-links">
                        <li><a href="index.html">HOME</a></li>
                        <li><a href="3d.html">USC</a></li>
                        <li><a href="predict.html">PREDICTION</a></li>
                        <li><a href="confusion.html">TUKEY'HSD</a></li>
                        <li><a href="ANOVA.html">REPORT</a></li>
                </ul>
        </nav>

        <div class="container">
                <h2>ANOVA Boxplot PM2.5 & PM10 by Week and Label</h2>
                <div class="controls">
                        <button id="btn-pm25" onclick="draw('pm25')">PM2.5</button>
                        <button id="btn-pm10" onclick="draw('pm10')">PM10</button>

                        <span style="margin: 0 20px;">|</span>
                        <button id="btn-view-all" onclick="setViewMode('all')">รวมทั้งหมด</button>
                        <button id="btn-view-week" onclick="setViewMode('week')">รายสัปดาห์</button>
                </div>
                <div id="error-box"></div>
                <div id="trend"></div>
        </div>
</body>
<script>
        const FILES = {
                pm25: 'pm25_byweek_clean.json',
                pm10: 'pm10_byweek_clean.json'
        };
        let allData = {};
        let chart = echarts.init(document.getElementById('trend'));

        // ********** ตัวแปรสถานะใหม่ **********
        let currentType = 'pm25'; // 'pm25' หรือ 'pm10'
        let viewMode = 'week'; // 'week' หรือ 'all' (เริ่มต้นเป็นรายสัปดาห์)
        // ********** /ตัวแปรสถานะใหม่ **********


        function showError(message) {
                document.getElementById('error-box').innerHTML = message;
                document.getElementById('error-box').style.display = 'block';
                chart.clear();
        }
        function hideError() {
                document.getElementById('error-box').innerHTML = "";
                document.getElementById('error-box').style.display = 'none';
        }

        // ********** ฟังก์ชันอัพเดทปุ่มควบคุม **********
        function updateButtons(type, mode) {
                // อัพเดทสถานะปุ่ม PM2.5/PM10
                document.getElementById('btn-pm25').classList.remove('active');
                document.getElementById('btn-pm10').classList.remove('active');
                document.getElementById(`btn-${type}`).classList.add('active');

                // อัพเดทสถานะปุ่มมุมมอง
                document.getElementById('btn-view-all').classList.remove('active');
                document.getElementById('btn-view-week').classList.remove('active');
                document.getElementById(`btn-view-${mode}`).classList.add('active');
        }

        // ฟังก์ชันสำหรับเปลี่ยนมุมมอง (รวม/รายสัปดาห์)
        function setViewMode(mode) {
                viewMode = mode;
                draw(currentType);
        }
        // ********** /ฟังก์ชันอัพเดทปุ่มควบคุม **********


        // --------------- โหลด 2 ไฟล์ ---------------
        Promise.all([fetch(FILES.pm25), fetch(FILES.pm10)])
                .then(responses => {
                        responses.forEach((r, i) => {
                                if (!r.ok) {
                                        showError("ERROR: ไม่พบไฟล์ " + Object.values(FILES)[i]);
                                        throw new Error("ไม่พบไฟล์ " + Object.values(FILES)[i]);
                                }
                        });
                        return Promise.all(responses.map(r => r.json()));
                })
                .then(([pm25, pm10]) => {
                        if (!Array.isArray(pm25) || !Array.isArray(pm10)) {
                                showError("ERROR: ไฟล์ข้อมูลต้องเป็น array (format json ผิด)");
                                return;
                        }
                        allData = { pm25, pm10 };
                        hideError();

                        // กำหนดสถานะเริ่มต้นและวาดกราฟ
                        currentType = 'pm25';
                        viewMode = 'week';
                        draw('pm25');
                })
                .catch(err => {
                        showError("ERROR: " + err.message);
                });

        // --------- ฟังก์ชัน process() ที่ปรับปรุงใหม่ให้รองรับ mode ------------
        function process(raw, mode) {
                try {
                        if (!raw || !Array.isArray(raw) || raw.length === 0) throw new Error("ไม่มีข้อมูลใน json");

                        const allLabels = [...new Set(raw.map(d => d.label))].sort();
                        let boxSeries = [];
                        let usedLabels = [];
                        let categories = []; // จะเป็น weeks หรือ labels ขึ้นอยู่กับ mode

                        if (mode === 'week') {
                                // --- โหมดแสดง "รายสัปดาห์" (Boxplot ต่อสัปดาห์) ---
                                categories = [...new Set(raw.map(d => d.pollutant_week))].sort();

                                allLabels.forEach(label => {
                                        // เตรียมข้อมูลของแต่ละ label แยกตาม week
                                        let allWeekData = categories.map(week =>
                                                raw.filter(d => d.label === label && d.pollutant_week === week).map(d => d.pollution)
                                        );
                                        let group = allWeekData.filter(arr => arr.length > 0);

                                        if (group.length > 0) {
                                                let d = echarts.dataTool.prepareBoxplotData(group);

                                                boxSeries.push({
                                                        name: label,
                                                        type: 'boxplot',
                                                        data: d.boxData,
                                                        itemStyle: { opacity: 0.8 },
                                                        tooltip: { formatter: '{b0}: {a0}<br/>{c0}' } // แสดงข้อมูล
                                                });
                                                usedLabels.push(label);
                                        }
                                });

                        } else if (mode === 'all') {
                                // --- โหมดแสดง "รวมทั้งหมด" (Boxplot เดียวสำหรับแต่ละ Label) ---
                                categories = allLabels; // แกน x คือ Label

                                allLabels.forEach((label, index) => {
                                        // กรองข้อมูลทั้งหมดของ label นั้น
                                        let group = [raw.filter(d => d.label === label).map(d => d.pollution)];

                                        if (group[0].length > 0) {
                                                let d = echarts.dataTool.prepareBoxplotData(group);

                                                // Boxplot ของ label (ใช้ index เป็นตำแหน่งบนแกน x)
                                                boxSeries.push({
                                                        name: label,
                                                        type: 'boxplot',
                                                        // d.boxData[0] คือ [min, Q1, median, Q3, max]
                                                        // เราเพิ่ม index เป็นตำแหน่ง X เข้าไปด้านหน้า
                                                        data: [[index, ...d.boxData[0]]],
                                                        itemStyle: { opacity: 0.8 },
                                                        tooltip: { formatter: '{b0}: {a0}<br/>{c0}' } // แสดงข้อมูล
                                                });
                                                usedLabels.push(label);
                                        }
                                });
                                categories = usedLabels; // แกน x ใช้ label ที่มีข้อมูลจริงเท่านั้น
                        }

                        if (usedLabels.length === 0) throw new Error("ทุกกลุ่มว่าง/ไม่มีข้อมูลค่าย่อยสำหรับ boxplot เลย");

                        return { categories, labels: usedLabels, series: boxSeries };
                } catch (e) {
                        // ตรวจจับ error จาก prepareBoxplotData ที่อาจเกิดขึ้นได้ถ้าข้อมูลไม่เพียงพอ
                        if (e.message.includes('Boxplot is missing') || e.message.includes('cannot be calculated')) {
                                showError("ERROR: ข้อมูลไม่เพียงพอสำหรับสร้าง Boxplot (อาจมีค่าน้อยเกินไป)");
                        } else {
                                showError("ERROR: " + e.message);
                        }
                        throw e;
                }
        }

        function draw(type) {
                try {
                        currentType = type; // อัพเดทสถานะ PM2.5/PM10
                        updateButtons(currentType, viewMode); // อัพเดทปุ่ม

                        hideError();
                        const raw = allData[type];
                        if (!raw) {
                                showError("ERROR: ไม่พบข้อมูล " + type);
                                return;
                        }
                        const pollutantLabel = type === 'pm25' ? 'PM2.5' : 'PM10';

                        // เรียก process ด้วย viewMode
                        const { categories, labels, series } = process(raw, viewMode);

                        // กำหนดค่าต่างๆ ตามโหมด
                        const xAxisName = viewMode === 'week' ? 'Week' : 'Label';
                        const titleText = viewMode === 'week'
                                ? `Boxplot of ${pollutantLabel} by Week and Label`
                                : `Overall Boxplot of ${pollutantLabel} by Label`;
                        const rotate = viewMode === 'week' ? 45 : 0;
                        const gridBottom = viewMode === 'week' ? '100' : '40'; // ปรับพื้นที่ด้านล่าง

                        const option = {
                                title: { text: titleText, left: "center" },
                                legend: {
                                        data: labels,
                                        left: "center",
                                        bottom: 0,
                                        orient: "horizontal"
                                },
                                tooltip: { trigger: "item", axisPointer: { type: "shadow" } },
                                grid: {
                                        left: "4%",
                                        right: "2%",
                                        bottom: gridBottom,
                                        top: 60
                                },
                                xAxis: {
                                        type: 'category', // ใช้ category เสมอ
                                        data: categories,
                                        name: xAxisName,
                                        axisLabel: {
                                                rotate: rotate,
                                                fontSize: 12,
                                                interval: 0,
                                                align: viewMode === 'week' ? 'right' : 'center'
                                        }
                                },
                                yAxis: {
                                        type: 'value',
                                        name: `${pollutantLabel} (pollution)`
                                },
                                series: series
                        };

                        chart.setOption(option, true);
                } catch (err) {
                        // error ถูกแสดงใน process() หรือ draw() แล้ว ไม่ต้องทำซ้ำ
                        console.error(err);
                }
        }
</script>

</html>
